# Selected work. Each section becomes a filter button on the Work page.
# To add a piece, copy an entry in the right section and change the fields.
# img: a file in images/work/, or yt:VIDEOID to use the YouTube thumbnail.
# url: a full address, or a path on this site such as /nj-schools/
# home: true puts the piece in the "Selected work" row on the home page (pick three).

featured:
  title: New Jersey public schools show pandemic recovery
  url: /nj-schools/
  img: images/work/nj-schools.jpg
  kicker: Data story · Columbia University · 2022
  text: >-
    My Columbia master's project. An analysis of 668 school districts on six performance
    measures found that 62% improved on most of them, while college enrollment fell almost
    everywhere and gains tilted toward wealthier districts.
  link_text: Read the story

sections:
  - id: agora
    title: Agora Journalism Center
    note: >-
      Interactive maps I built for the Center's statewide assessment of Oregon's local news
      and information ecosystem.
    columns: 2
    items:
      - title: Local News Ecosystem in Oregon
        url: https://agorajournalism.center/wp-content/uploads/agora-scrolly/
        img: images/work/agora-scrolly.jpg
        text: >-
          A scrolling map story that walks through the assessment's findings: 241 outlets producing
          original local news in 97 Oregon cities, how they are owned, and the counties left with
          one or two sources.
        home: true
      - title: "Oregon's Local News Media Ecosystem: Unequal Distribution"
        url: https://agorajournalism.center/wp-content/uploads/oregon-local-news-map/
        img: images/work/agora-map.jpg
        text: >-
          A clickable map of every outlet in the database, sized by circulation or audience and
          set against county population density.

